apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: food-delivery
spec:
  template:
    spec:
      containers:
        - name: dashboard
          env:
            - name: NUXT_PUBLIC_GRAFANA_EXPLORE_URL
              value: http://localhost:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: food-delivery
spec:
  template:
    spec:
      containers:
        - name: control-api
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: customer-simulator
  namespace: food-delivery
spec:
  template:
    spec:
      containers:
        - name: customer-simulator
